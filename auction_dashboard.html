<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>早盘竞价看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,500;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10141B; --panel:#171C25; --panel-2:#1D232E; --line:#2A313D;
    --text:#ECEFF3; --muted:#8B93A1; --gold:#D6A339;
    --up:#E0484F; --down:#35A776; --warn:#E3B341;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'IBM Plex Sans', sans-serif; min-height:100vh; padding:32px 24px 80px;}
  .wrap{max-width:1000px;margin:0 auto;}
  header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:28px;}
  h1{font-family:'Source Serif 4', serif;font-style:italic;font-weight:700;font-size:32px;margin:0 0 6px;}
  header p{margin:0;color:var(--muted);font-size:14px;max-width:60ch;line-height:1.6;}
  .meta{font-family:'IBM Plex Mono', monospace;font-size:12px;color:var(--muted);text-align:right;}
  .meta .dot{color:var(--gold);}
  .loader{border:1px dashed var(--line);border-radius:2px;padding:56px 24px;text-align:center;color:var(--muted);}
  .loader strong{color:var(--text);font-weight:600;}
  .filebtn{display:inline-block;margin-top:18px;padding:10px 22px;background:var(--gold);color:#1A1400;font-weight:600;font-size:14px;border-radius:2px;cursor:pointer;border:none;font-family:'IBM Plex Sans', sans-serif;}
  input[type=file]{display:none;}
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:24px;}
  .stat{background:var(--panel);padding:18px 20px;}
  .stat .num{font-family:'IBM Plex Mono', monospace;font-size:26px;font-weight:600;line-height:1;}
  .stat .label{margin-top:8px;font-size:12.5px;color:var(--muted);}
  .stat.up .num{color:var(--up);} .stat.down .num{color:var(--down);} .stat.gold .num{color:var(--gold);}
  .controls{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap;}
  .controls input[type=text]{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 12px;font-size:13px;border-radius:2px;width:180px;font-family:'IBM Plex Sans', sans-serif;}
  .controls .spacer{flex:1;}
  .controls .reload{font-size:12px;color:var(--muted);text-decoration:underline;cursor:pointer;background:none;border:none;font-family:'IBM Plex Sans', sans-serif;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);color:var(--muted);font-weight:500;font-size:12px;cursor:pointer;white-space:nowrap;user-select:none;}
  thead th:hover{color:var(--text);}
  thead th.active{color:var(--gold);}
  tbody td{padding:11px 12px;border-bottom:1px solid var(--line);font-family:'IBM Plex Mono', monospace;white-space:nowrap;}
  tbody td.name-cell{font-family:'IBM Plex Sans', sans-serif;font-weight:500;}
  tbody tr:hover{background:var(--panel);}
  .up{color:var(--up);} .down{color:var(--down);}
  footer{max-width:1000px;margin:40px auto 0;color:var(--muted);font-size:12px;line-height:1.7;border-top:1px solid var(--line);padding-top:18px;}
  @media (max-width:800px){.summary{grid-template-columns:repeat(2,1fr);} table{font-size:12px;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>早盘竞价看板</h1>
      <p>展示 fetch_auction.py 抓取的最新竞价/实时行情快照，独立于技术面评分看板。</p>
    </div>
    <div class="meta" id="metaBox"></div>
  </header>

  <div id="loaderBox" class="loader">
    <div><strong>还没有加载数据</strong></div>
    <div style="margin-top:8px;">运行 <code>python fetch_auction.py</code> 后，选择生成的 <code>auction_data/竞价数据.json</code> 文件</div>
    <label class="filebtn">选择数据文件<input type="file" id="fileInput" accept=".json"></label>
  </div>
  <div id="autoLoadingBox" class="loader" style="display:none;"><div><strong>正在加载最新数据…</strong></div></div>

  <div id="mainBox" style="display:none;">
    <div class="summary" id="summaryBox"></div>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="搜索股票名称/代码">
      <div class="spacer"></div>
      <button class="reload" id="reloadBtn">重新选择文件</button>
    </div>
    <table>
      <thead><tr id="tableHead"></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <footer>
    说明：数据来自新浪财经实时行情接口。该接口官方注明短时间内反复调用会被临时限制访问，
    所以建议一个交易日只运行一次 fetch_auction.py（推荐在集合竞价快结束时，约9:24-9:25），
    不要短时间内反复抓取。本页面只做数据展示，不构成投资建议。
  </footer>
</div>

<script>
let RAW = [];
let LATEST_BY_CODE = {};

function applyPayload(payload){
  const rows = payload.数据 || [];
  // 同一只股票当天可能有多条记录(多次运行)，这里按抓取时间取最新一条展示
  const map = {};
  rows.forEach(r=>{
    const code = r.代码_纯数字 || r.代码;
    if(!map[code] || String(r.抓取时间) > String(map[code].抓取时间)){
      map[code] = r;
    }
  });
  LATEST_BY_CODE = map;
  RAW = Object.values(map);

  document.getElementById('metaBox').innerHTML =
    `交易日 <span class="dot">·</span> ${payload.交易日期}<br>最近抓取 <span class="dot">·</span> ${payload.生成时间}`;
  document.getElementById('loaderBox').style.display = 'none';
  document.getElementById('autoLoadingBox').style.display = 'none';
  document.getElementById('mainBox').style.display = 'block';
  render();
}

(function tryAutoLoad(){
  document.getElementById('loaderBox').style.display = 'none';
  document.getElementById('autoLoadingBox').style.display = 'block';
  fetch(encodeURI('auction_data/竞价数据.json'), {cache:'no-store'})
    .then(res => { if(!res.ok) throw new Error('not found'); return res.json(); })
    .then(payload => applyPayload(payload))
    .catch(() => {
      document.getElementById('autoLoadingBox').style.display = 'none';
      document.getElementById('loaderBox').style.display = 'block';
    });
})();

const fileInput = document.getElementById('fileInput');
document.getElementById('reloadBtn').addEventListener('click', ()=>fileInput.click());
fileInput.addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{ applyPayload(JSON.parse(evt.target.result)); }
    catch(err){ alert('文件解析失败，请确认选择的是 fetch_auction.py 生成的 竞价数据.json'); }
  };
  reader.readAsText(file, 'utf-8');
});

let sortKey = '涨跌幅';
let sortAsc = false;

const COLS = [
  {key:'名称', label:'名称', name:true},
  {key:'最新价', label:'最新价'},
  {key:'涨跌幅', label:'涨跌幅', pct:true},
  {key:'今开', label:'今开'},
  {key:'昨收', label:'昨收'},
  {key:'最高', label:'最高'},
  {key:'最低', label:'最低'},
  {key:'成交量', label:'成交量'},
  {key:'成交额', label:'成交额'},
  {key:'抓取时间', label:'抓取时间'},
];

document.getElementById('searchInput').addEventListener('input', render);

function getFiltered(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  return RAW.filter(r=>{
    if(q && !(String(r.名称).toLowerCase().includes(q) || String(r.代码_纯数字||r.代码).includes(q))) return false;
    return true;
  });
}

function renderSummary(){
  const total = RAW.length;
  const up = RAW.filter(r=>r.涨跌幅>0).length;
  const down = RAW.filter(r=>r.涨跌幅<0).length;
  document.getElementById('summaryBox').innerHTML = [
    {label:'股票数量', num:total, cls:'gold'},
    {label:'上涨家数', num:up, cls:'up'},
    {label:'下跌家数', num:down, cls:'down'},
  ].map(s=>`<div class="stat ${s.cls}"><div class="num">${s.num}</div><div class="label">${s.label}</div></div>`).join('');
}

function renderTable(){
  const head = document.getElementById('tableHead');
  head.innerHTML = COLS.map(c=>`<th data-key="${c.key}" class="${c.key===sortKey?'active':''}">${c.label}${c.key===sortKey?(sortAsc?' ▲':' ▼'):''}</th>`).join('');
  head.querySelectorAll('th[data-key]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const k = th.dataset.key;
      if(sortKey===k) sortAsc=!sortAsc; else {sortKey=k; sortAsc=true;}
      render();
    });
  });

  let rows = getFiltered();
  rows.sort((a,b)=>{
    let av=a[sortKey], bv=b[sortKey];
    if(av==null) av = sortAsc?Infinity:-Infinity;
    if(bv==null) bv = sortAsc?Infinity:-Infinity;
    if(typeof av === 'string') return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
    return sortAsc ? av-bv : bv-av;
  });

  const body = document.getElementById('tableBody');
  body.innerHTML = '';
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    tr.innerHTML = COLS.map(c=>{
      const val = r[c.key];
      if(c.name) return `<td class="name-cell">${val}<br><span style="color:var(--muted);font-size:11px;">${r.代码_纯数字||r.代码}</span></td>`;
      if(c.pct){
        if(val==null) return `<td>-</td>`;
        const cls = val>0?'up':(val<0?'down':'');
        return `<td class="${cls}">${val>0?'+':''}${val}%</td>`;
      }
      return `<td>${val==null?'-':val}</td>`;
    }).join('');
    body.appendChild(tr);
  });
}

function render(){ renderSummary(); renderTable(); }
</script>
</body>
</html>
